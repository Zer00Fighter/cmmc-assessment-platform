{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
{% if organization %}<nav class="crumb"><a href="{% url 'organization-list' %}">Organizations</a> / <a href="{% url 'system-list' organization.slug %}">{{ organization.name }}</a> / {{ title }}</nav>{% endif %}
<section class="form-card"><p class="eyebrow">{{ eyebrow }}</p><h1>{{ title }}</h1><form method="post" class="stack">{% csrf_token %}{{ form.as_p }}<button class="primary" type="submit">{{ submit_label }}</button></form></section>
{% endblock %}
